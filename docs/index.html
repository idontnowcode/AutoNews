<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>경제 Shorts 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Malgun Gothic',sans-serif;background:#0d0d1a;color:#fff;min-height:100vh;padding-bottom:40px}
a{color:inherit;text-decoration:none}
button{cursor:pointer;border:none;background:none;color:inherit}

/* 헤더 */
.header{position:sticky;top:0;z-index:40;background:#0d0d1a;border-bottom:1px solid #ffffff18;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.header-title{font-size:18px;font-weight:700;color:#FFD60A}
.header-sub{font-size:11px;color:#666;margin-top:2px}
.btn-gear{width:36px;height:36px;border-radius:50%;background:#ffffff15;display:flex;align-items:center;justify-content:center;font-size:18px}

/* 탭 */
.tabs{display:flex;border-bottom:1px solid #ffffff15;background:#0d0d1a;position:sticky;top:60px;z-index:30}
.tab-btn{flex:1;padding:12px 4px;font-size:13px;font-weight:600;color:#666;border-bottom:3px solid transparent;transition:all .2s}
.tab-btn.active{color:#FFD60A;border-bottom-color:#FFD60A}

/* 카드 */
.card{background:#1a1a2e;border:1px solid #ffffff15;border-radius:12px}
.section{padding:16px}

/* 진행률 */
.progress-card{padding:16px;margin-bottom:16px}
.progress-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.progress-bar-bg{background:#ffffff15;border-radius:9999px;height:10px;margin-bottom:12px}
.progress-bar-fill{background:#FFD60A;height:10px;border-radius:9999px;transition:width .5s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat-num{font-size:22px;font-weight:700}
.stat-label{font-size:11px;color:#666;margin-top:2px}

/* 다음 차례 */
.next-card{background:linear-gradient(135deg,#FFD60A18,#FFD60A08);border:1px solid #FFD60A55;border-radius:12px;padding:14px;margin-bottom:16px;display:none}
.next-badge{font-size:11px;font-weight:700;color:#FFD60A;margin-bottom:4px}
.next-title{font-size:15px;font-weight:700}
.next-meta{font-size:11px;color:#888;margin-top:4px}

/* 그룹 */
.group-card{margin-bottom:12px;overflow:hidden}
.group-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;background:#1a1a2e}
.group-name{font-weight:600;font-size:14px}
.group-count{font-size:12px;color:#666;margin-left:6px}
.group-arrow{font-size:12px;color:#666;transition:transform .2s}
.group-body{border-top:1px solid #ffffff10}
.topic-row{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid #ffffff08}
.topic-row:last-child{border-bottom:none}
.topic-row.next-row{background:#FFD60A08}
.topic-name{font-size:13px;font-weight:500}
.topic-sub{font-size:11px;color:#555;margin-top:2px}

/* 뱃지 */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:9999px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-done{background:#16a34a22;color:#4ade80;border:1px solid #16a34a55}
.badge-progress{background:#d9770622;color:#fb923c;border:1px solid #d9770655}
.badge-next{background:#FFD60A22;color:#FFD60A;border:1px solid #FFD60A55}
.badge-pending{background:#ffffff0f;color:#666;border:1px solid #ffffff20}

/* 폼 */
.form-section{padding:16px}
.form-group{margin-bottom:14px}
.form-label{font-size:12px;color:#888;margin-bottom:6px;display:block}
.form-input{background:#1a1a2e;border:1px solid #ffffff25;border-radius:8px;color:#fff;padding:10px 14px;width:100%;font-size:14px;outline:none;font-family:inherit}
.form-input:focus{border-color:#FFD60A88}
select.form-input option{background:#1a1a2e}
textarea.form-input{resize:vertical;min-height:72px}
.btn-primary{background:#FFD60A;color:#000;font-weight:700;border-radius:8px;padding:13px;width:100%;font-size:15px;margin-top:4px}
.btn-secondary{background:#ffffff15;color:#fff;border-radius:8px;padding:11px;width:100%;font-size:13px}
.divider{display:flex;align-items:center;gap:8px;margin:12px 0}
.divider-line{flex:1;height:1px;background:#ffffff15}
.divider-text{font-size:11px;color:#555}

/* 결과 */
.result-card{padding:20px;text-align:center;margin-top:12px;display:none}
.result-icon{font-size:28px;margin-bottom:8px}
.result-title{font-weight:700;font-size:15px}
.result-sub{font-size:12px;color:#888;margin-top:4px}

/* 히스토리 */
.video-card{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid #ffffff10}
.video-card:last-child{border-bottom:none}
.video-thumb{width:80px;height:56px;object-fit:cover;border-radius:8px;background:#1a1a2e;flex-shrink:0}
.video-title{font-size:13px;font-weight:600;margin-bottom:3px}
.video-date{font-size:11px;color:#666}
.video-link{font-size:11px;color:#FFD60A;margin-top:2px}

/* 모달 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:none;align-items:flex-end}
.modal-box{background:#12121f;border-radius:20px 20px 0 0;width:100%;padding:24px;border:1px solid #ffffff18;max-height:90vh;overflow-y:auto}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-title{font-size:16px;font-weight:700}
.modal-close{font-size:20px;color:#666;padding:4px 8px}
.modal-footer{margin-top:8px}

/* 토스트 */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2a2a3e;color:#fff;font-size:13px;padding:8px 18px;border-radius:9999px;border:1px solid #ffffff20;z-index:200;display:none;white-space:nowrap}

/* 빈 상태 */
.empty{text-align:center;padding:40px 20px;color:#555;font-size:13px}
.empty-icon{font-size:32px;margin-bottom:8px}
</style>
</head>
<body>

<!-- 헤더 -->
<div class="header">
  <div>
    <div class="header-title">경제 Shorts</div>
    <div class="header-sub" id="headerSub">연결 대기 중...</div>
  </div>
  <button class="btn-gear" onclick="openModal()">⚙️</button>
</div>

<!-- 탭 -->
<div class="tabs">
  <button class="tab-btn active" id="tabBtn0" onclick="showTab(0)">📚 커리큘럼</button>
  <button class="tab-btn" id="tabBtn1" onclick="showTab(1)">🎬 영상 요청</button>
  <button class="tab-btn" id="tabBtn2" onclick="showTab(2)">📋 히스토리</button>
</div>

<!-- 탭 0: 커리큘럼 -->
<div id="tabPane0">
  <div class="section">

    <div class="card progress-card">
      <div class="progress-label">
        <span style="font-size:13px;font-weight:600;color:#ccc">전체 진행률</span>
        <span id="progressText" style="font-size:13px;font-weight:700;color:#FFD60A">-/-</span>
      </div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
      <div class="stats">
        <div><div class="stat-num" id="cntDone" style="color:#4ade80">-</div><div class="stat-label">완료</div></div>
        <div><div class="stat-num" id="cntProg" style="color:#fb923c">-</div><div class="stat-label">진행중</div></div>
        <div><div class="stat-num" id="cntPend" style="color:#666">-</div><div class="stat-label">대기</div></div>
      </div>
    </div>

    <div class="next-card" id="nextCard">
      <div class="next-badge">▶ 다음 차례</div>
      <div class="next-title" id="nextTitle"></div>
      <div class="next-meta" id="nextMeta"></div>
    </div>

    <div id="topicContainer">
      <div class="empty"><div class="empty-icon">🔌</div>⚙️ 설정에서 Supabase 연결 정보를 입력하세요</div>
    </div>

  </div>
</div>

<!-- 탭 1: 영상 요청 -->
<div id="tabPane1" style="display:none">
  <div class="form-section">
    <div class="card" style="padding:16px">
      <div style="font-size:13px;font-weight:700;color:#FFD60A;margin-bottom:14px">✏️ 원하는 주제로 영상 만들기</div>

      <div class="form-group">
        <label class="form-label">주제명 *</label>
        <input id="reqTitle" class="form-input" type="text" placeholder="예) 복리, 달러 환율, 부동산 PF">
      </div>
      <div class="form-group">
        <label class="form-label">카테고리</label>
        <select id="reqCat" class="form-input">
          <option>거시경제</option><option>투자</option><option>금융시장</option>
          <option>재정</option><option>국제경제</option><option>행동경제학</option><option>기타</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">난이도</label>
        <select id="reqLevel" class="form-input">
          <option value="basic">기초</option>
          <option value="intermediate">중급</option>
          <option value="advanced">심화</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">설명 (선택)</label>
        <textarea id="reqDesc" class="form-input" placeholder="어떤 내용을 다뤄야 할지 간단히 적어주세요"></textarea>
      </div>

      <button class="btn-primary" onclick="submitTopic(false)">📌 영상 생성 요청</button>

      <div id="triggerWrap" style="display:none">
        <div class="divider"><div class="divider-line"></div><span class="divider-text">또는</span><div class="divider-line"></div></div>
        <button class="btn-secondary" onclick="submitTopic(true)">⚡ 요청 + 즉시 GitHub Actions 실행</button>
      </div>
    </div>

    <div class="card result-card" id="resultCard">
      <div class="result-icon">✅</div>
      <div class="result-title">요청이 접수되었습니다</div>
      <div class="result-sub">다음 스케줄 실행(매일 KST 07:00) 시 생성됩니다</div>
    </div>
  </div>
</div>

<!-- 탭 2: 히스토리 -->
<div id="tabPane2" style="display:none">
  <div class="card" style="margin:16px" id="historyContainer">
    <div class="empty"><div class="empty-icon">🔌</div>Supabase 연결 후 표시됩니다</div>
  </div>
</div>

<!-- 모달 -->
<div class="modal-overlay" id="modal" onclick="overlayClick(event)">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title">⚙️ 연결 설정</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <div class="form-group">
      <label class="form-label">Supabase URL *</label>
      <input id="cfgUrl" class="form-input" type="url" placeholder="https://xxxx.supabase.co">
    </div>
    <div class="form-group">
      <label class="form-label">Supabase Anon Key *</label>
      <input id="cfgKey" class="form-input" type="password" placeholder="eyJhb...">
    </div>
    <div class="form-group">
      <label class="form-label">GitHub Token <span style="color:#555">(즉시 실행용, 선택)</span></label>
      <input id="cfgToken" class="form-input" type="password" placeholder="ghp_...">
      <div style="font-size:11px;color:#555;margin-top:4px">workflow 권한 필요 · 입력 시 즉시 실행 버튼 활성화</div>
    </div>
    <div class="form-group">
      <label class="form-label">GitHub 저장소 <span style="color:#555">(즉시 실행용, 선택)</span></label>
      <input id="cfgRepo" class="form-input" type="text" placeholder="username/AutoNews">
    </div>

    <div class="modal-footer">
      <button class="btn-primary" onclick="saveConfig()">저장 및 연결</button>
    </div>
  </div>
</div>

<!-- 토스트 -->
<div class="toast" id="toast"></div>

<script>
// ── 설정 ─────────────────────────────────────────
var sb = null;
var cfg = {};

function loadCfg() {
  try { cfg = JSON.parse(localStorage.getItem('econ_cfg') || '{}'); } catch(e) { cfg = {}; }
}

function saveCfg() {
  cfg = {
    url:   document.getElementById('cfgUrl').value.trim(),
    key:   document.getElementById('cfgKey').value.trim(),
    token: document.getElementById('cfgToken').value.trim(),
    repo:  document.getElementById('cfgRepo').value.trim()
  };
  if (!cfg.url || !cfg.key) { toast('URL과 Key는 필수입니다'); return; }
  localStorage.setItem('econ_cfg', JSON.stringify(cfg));
  closeModal();
  connect();
}

// 이름 충돌 방지용 별도 함수명 사용
function saveConfig() { saveCfg(); }

function connect() {
  if (!cfg.url || !cfg.key) return;
  try {
    sb = window.supabase.createClient(cfg.url, cfg.key);
    document.getElementById('triggerWrap').style.display = cfg.token ? 'block' : 'none';
    loadCurriculum();
    loadHistory();
  } catch(e) {
    toast('연결 오류: ' + e.message);
  }
}

// ── 모달 ─────────────────────────────────────────
function openModal() {
  document.getElementById('cfgUrl').value   = cfg.url   || '';
  document.getElementById('cfgKey').value   = cfg.key   || '';
  document.getElementById('cfgToken').value = cfg.token || '';
  document.getElementById('cfgRepo').value  = cfg.repo  || '';
  document.getElementById('modal').style.display = 'flex';
}
function closeModal() {
  document.getElementById('modal').style.display = 'none';
}
function overlayClick(e) {
  if (e.target === document.getElementById('modal')) closeModal();
}

// ── 탭 ───────────────────────────────────────────
function showTab(n) {
  for (var i = 0; i < 3; i++) {
    document.getElementById('tabPane' + i).style.display = i === n ? 'block' : 'none';
    var btn = document.getElementById('tabBtn' + i);
    btn.className = 'tab-btn' + (i === n ? ' active' : '');
  }
}

// ── 커리큘럼 ──────────────────────────────────────
async function loadCurriculum() {
  if (!sb) return;
  var res = await sb.from('topics').select('id,title,category,level,status,order_index').order('order_index');
  if (res.error) { toast('오류: ' + res.error.message); return; }
  var topics = res.data || [];

  var done = topics.filter(function(t){return t.status==='done'}).length;
  var prog = topics.filter(function(t){return t.status==='in_progress'}).length;
  var pend = topics.filter(function(t){return t.status==='pending'}).length;
  var total = topics.length;
  var pct = total ? Math.round(done/total*100) : 0;

  document.getElementById('progressText').textContent = done+'/'+total;
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('cntDone').textContent = done;
  document.getElementById('cntProg').textContent = prog;
  document.getElementById('cntPend').textContent = pend;
  document.getElementById('headerSub').textContent = '진행률 '+pct+'% · 총 '+total+'개 주제';

  var next = topics.find(function(t){return t.status==='pending'});
  if (next) {
    document.getElementById('nextCard').style.display = 'block';
    document.getElementById('nextTitle').textContent = "'"+next.title+"' 이란?";
    document.getElementById('nextMeta').textContent = next.category+' · '+lvl(next.level)+' · #'+next.order_index;
  }

  // 카테고리 그룹
  var groups = {};
  topics.forEach(function(t) {
    if (!groups[t.category]) groups[t.category] = [];
    groups[t.category].push(t);
  });

  var html = '';
  Object.keys(groups).forEach(function(cat) {
    var items = groups[cat];
    var doneN = items.filter(function(i){return i.status==='done'}).length;
    html += '<div class="card group-card">';
    html += '<div class="group-header" onclick="toggleGroup(\'g_'+cat+'\')">';
    html += '<span class="group-name">'+cat+'<span class="group-count">'+doneN+'/'+items.length+'</span></span>';
    html += '<span class="group-arrow" id="arr_'+cat+'">▼</span>';
    html += '</div>';
    html += '<div class="group-body" id="g_'+cat+'">';
    items.forEach(function(t) {
      var isNext = next && t.id === next.id;
      var badgeCls = isNext ? 'badge-next' : t.status==='done' ? 'badge-done' : t.status==='in_progress' ? 'badge-progress' : 'badge-pending';
      var badgeTxt = isNext ? '▶ 다음' : t.status==='done' ? '완료' : t.status==='in_progress' ? '진행중' : '대기';
      html += '<div class="topic-row'+(isNext?' next-row':'')+'">';
      html += '<div><div class="topic-name">'+t.title+'</div><div class="topic-sub">'+lvl(t.level)+' · #'+t.order_index+'</div></div>';
      html += '<span class="badge '+badgeCls+'">'+badgeTxt+'</span>';
      html += '</div>';
    });
    html += '</div></div>';
  });
  document.getElementById('topicContainer').innerHTML = html || '<div class="empty">주제 없음</div>';
}

function toggleGroup(id) {
  var el = document.getElementById(id);
  var cat = id.replace('g_','');
  var arr = document.getElementById('arr_'+cat);
  if (el.style.display === 'none') { el.style.display='block'; arr.style.transform=''; }
  else { el.style.display='none'; arr.style.transform='rotate(-90deg)'; }
}

// ── 히스토리 ──────────────────────────────────────
async function loadHistory() {
  if (!sb) return;
  var res = await sb.from('videos').select('id,title,youtube_id,created_at').order('created_at',{ascending:false}).limit(30);
  if (res.error) return;
  var vids = res.data || [];
  var el = document.getElementById('historyContainer');
  if (!vids.length) { el.innerHTML='<div class="empty"><div class="empty-icon">📭</div>아직 생성된 영상이 없습니다</div>'; return; }
  var html = '';
  vids.forEach(function(v) {
    html += '<a class="video-card" href="https://youtube.com/shorts/'+v.youtube_id+'" target="_blank">';
    html += '<img class="video-thumb" src="https://i.ytimg.com/vi/'+v.youtube_id+'/mqdefault.jpg" onerror="this.style.background=\'#1a1a2e\'">';
    html += '<div><div class="video-title">'+( v.title||'제목 없음')+'</div>';
    html += '<div class="video-date">'+fmtDate(v.created_at)+'</div>';
    html += '<div class="video-link">▶ YouTube Shorts</div></div>';
    html += '</a>';
  });
  el.innerHTML = html;
}

// ── 주제 제출 ─────────────────────────────────────
async function submitTopic(triggerNow) {
  if (!sb) { openModal(); return; }
  var title = document.getElementById('reqTitle').value.trim();
  if (!title) { toast('주제명을 입력하세요'); return; }

  var maxRes = await sb.from('topics').select('order_index').order('order_index',{ascending:false}).limit(1);
  var nextIdx = (maxRes.data && maxRes.data.length) ? maxRes.data[0].order_index + 1 : 100;

  var ins = await sb.from('topics').insert({
    title: title, title_en: title,
    category: document.getElementById('reqCat').value,
    level: document.getElementById('reqLevel').value,
    description: document.getElementById('reqDesc').value.trim() || title+'에 대한 경제 교육 콘텐츠',
    status: 'pending', order_index: nextIdx,
    prerequisites: [], related_topics: []
  });

  if (ins.error) { toast('오류: ' + ins.error.message); return; }

  if (triggerNow) await triggerActions();

  document.getElementById('reqTitle').value = '';
  document.getElementById('reqDesc').value  = '';
  document.getElementById('resultCard').style.display = 'block';
  toast(triggerNow ? '요청 + Actions 실행됨' : '영상 생성 요청 완료');
  setTimeout(function(){ document.getElementById('resultCard').style.display='none'; }, 4000);
  loadCurriculum();
}

async function triggerActions() {
  if (!cfg.token || !cfg.repo) { toast('GitHub 설정이 없습니다'); return; }
  var parts = cfg.repo.split('/');
  var res = await fetch('https://api.github.com/repos/'+parts[0]+'/'+parts[1]+'/actions/workflows/daily_shorts.yml/dispatches', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer '+cfg.token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
    body: JSON.stringify({ref:'main'})
  });
  if (!res.ok) toast('GitHub 실행 실패: ' + res.status);
}

// ── 유틸 ─────────────────────────────────────────
function lvl(l) { return l==='basic'?'기초':l==='intermediate'?'중급':'심화'; }
function fmtDate(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  return d.getFullYear()+'.'+(d.getMonth()+1+'').padStart(2,'0')+'.'+( d.getDate()+'').padStart(2,'0');
}
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.style.display='none'; }, 2500);
}

// ── 초기화 ────────────────────────────────────────
loadCfg();
if (cfg.url && cfg.key) {
  connect();
} else {
  openModal();
}
</script>
</body>
</html>
