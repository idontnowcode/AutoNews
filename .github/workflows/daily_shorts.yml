name: 경제 교육 Shorts 자동 업로드

on:
  schedule:
    - cron: '0 * * * *'    # 매시간 실행 — 실제 업로드 여부는 Supabase settings로 제어
  workflow_dispatch:
    inputs:
      force:
        description: '간격 체크 무시하고 즉시 실행'
        required: false
        default: 'true'

jobs:
  create-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 시스템 패키지 설치 (FFmpeg + 한글 폰트)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-nanum fonts-nanum-extra
          fc-cache -fv
          echo "--- 설치된 나눔 폰트 확인 ---"
          fc-list | grep -i nanum || echo "WARNING: nanum fonts not found!"
          ls /usr/share/fonts/truetype/nanum/ || echo "WARNING: nanum dir not found!"

      - name: Python 패키지 설치
        run: pip install --no-cache-dir -r requirements.txt

      - name: 파이프라인 실행
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
          ELEVENLABS_API_KEY:  ${{ secrets.ELEVENLABS_API_KEY }}
          YOUTUBE_TOKEN:       ${{ secrets.YOUTUBE_TOKEN }}
          FORCE_RUN:           ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python main.py

      - name: 결과물 보관 (3일)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-output-${{ github.run_number }}
          path: output/
          retention-days: 3
