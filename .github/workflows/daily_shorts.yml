name: 일분 스튜디오 - 커리큘럼 Shorts 업로드

on:
  # schedule 비활성화 — 수동 실행(workflow_dispatch)만 허용
  # schedule:
  #   - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '간격 체크 무시하고 즉시 실행'
        required: false
        default: 'true'

jobs:
  create-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 시스템 패키지 설치 (FFmpeg + 한글 폰트)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-nanum fonts-nanum-extra
          fc-cache -fv
          echo "--- 설치된 나눔 폰트 확인 ---"
          fc-list | grep -i nanum || echo "WARNING: nanum fonts not found!"
          ls /usr/share/fonts/truetype/nanum/ || echo "WARNING: nanum dir not found!"

      - name: Python 패키지 설치
        run: pip install --no-cache-dir -r requirements.txt

      - name: 아웃트로 asset 캐시 복원
        id: cache-outro
        uses: actions/cache@v4
        with:
          path: assets/
          key: outro-assets-v2

      - name: 아웃트로 asset 생성 (캐시 없을 때)
        if: steps.cache-outro.outputs.cache-hit != 'true'
        env:
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python tools/generate_outro_assets.py

      - name: 파이프라인 실행
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
          ELEVENLABS_API_KEY:  ${{ secrets.ELEVENLABS_API_KEY }}
          YOUTUBE_TOKEN:       ${{ secrets.YOUTUBE_TOKEN }}
          YOUTUBE_TOKEN_EN:    ${{ secrets.YOUTUBE_TOKEN_EN }}
          FORCE_RUN:           ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python main.py

      - name: 결과물 보관 (3일)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-output-${{ github.run_number }}
          path: output/
          retention-days: 3
