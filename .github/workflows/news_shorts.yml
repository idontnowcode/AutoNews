name: 일분 스튜디오 - 뉴스 Shorts 업로드

on:
  schedule:
    - cron: '0 * * * *'    # 매시간 — 실제 실행 여부는 Supabase settings로 제어
  workflow_dispatch:
    inputs:
      news_id:
        description: '처리할 뉴스 ID (없으면 자동 선택)'
        required: false
        default: ''

jobs:
  news-create-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 시스템 패키지 설치 (FFmpeg + 한글 폰트)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-nanum fonts-nanum-extra
          fc-cache -fv

      - name: Python 패키지 설치
        run: pip install --no-cache-dir -r requirements.txt

      - name: 아웃트로 asset 캐시 복원
        id: cache-outro
        uses: actions/cache@v4
        with:
          path: assets/
          key: outro-assets-v1

      - name: 아웃트로 asset 생성 (캐시 없을 때)
        if: steps.cache-outro.outputs.cache-hit != 'true'
        env:
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python tools/generate_outro_assets.py

      - name: 뉴스 파이프라인 실행
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
          ELEVENLABS_API_KEY:  ${{ secrets.ELEVENLABS_API_KEY }}
          YOUTUBE_TOKEN:       ${{ secrets.YOUTUBE_TOKEN }}
          FORCE_RUN:           ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          NEWS_ID:             ${{ github.event.inputs.news_id }}
        run: python news_main.py

      - name: 결과물 보관 (3일)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-output-${{ github.run_number }}
          path: output/
          retention-days: 3
